name: Rust Ragdoll Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify web page
        run: |
          cargo build
          target/debug/robot > server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ | grep --quiet "Hello, Ragdoll!"; then
              ready=true
              break
            fi
            sleep 1
          done
          cat server.log
          test "$ready" = true
          curl --fail --silent http://127.0.0.1:3000/cat.png --output cat-check.png
          test -s cat-check.png
          file cat-check.png
